name: Relay Windows checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Check relay scope parsing on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          git switch -c ci-relay-scope
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a test branch' }

          $taskPath = '.agent-sync/TASK.md'
          $original = [System.IO.File]::ReadAllBytes((Resolve-Path $taskPath))
          try {
            $validTask = @(
              '# Windows parser check', '', '## Goal',
              'Check the relay task scope parser without calling either agent.',
              '', '## Scope', '- `docs/RELAY_SMOKE_TEST.md`'
            ) -join "`n"
            [System.IO.File]::WriteAllText((Resolve-Path $taskPath), $validTask)
            $valid = node scripts/agent-relay.mjs 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $valid -notmatch '"taskReady": true') {
              throw "Valid exact-path scope was rejected: $valid"
            }

            $invalidTask = @(
              '# Windows parser check', '', '## Goal',
              'Reject ambiguous scope text before invoking either agent.',
              '', '## Scope', '- `docs/RELAY_SMOKE_TEST.md`',
              '- Do not edit `src/App.tsx`'
            ) -join "`n"
            [System.IO.File]::WriteAllText((Resolve-Path $taskPath), $invalidTask)
            $invalid = node scripts/agent-relay.mjs 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $invalid -notmatch '"taskReady": false') {
              throw "Ambiguous scope appeared ready: $invalid"
            }
            $blocked = node scripts/agent-relay.mjs --execute 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0 -or $blocked -notmatch 'Scope must contain only bullet lines') {
              throw "Execute did not reject ambiguous scope: $blocked"
            }
          }
          finally {
            [System.IO.File]::WriteAllBytes((Resolve-Path $taskPath), $original)
          }
